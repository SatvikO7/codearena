server {
    # 8080, not 80: this nginx runs as an unprivileged user and cannot bind a port
    # below 1024. The published port is unchanged -- compose maps the host's 5173 to
    # this one -- so nothing outside the container has to know.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx's add_header directives are NOT inherited into a `location` that declares
    # any add_header of its own. Both locations below set Cache-Control, so the
    # security headers must be repeated in each one - declaring them at server level
    # would silently drop them from every response.

    # Hashed asset filenames are immutable, so they can be cached indefinitely.
    # Cache-Control is set once, via add_header only: combining it with `expires`
    # emits two conflicting Cache-Control headers.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths are handled by React Router, not by nginx.
    # index.html itself must never be cached or clients would pin an old bundle.
    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
