# =============================================================================
# CodeArena API server
#
# Every value that differs between environments is read from an environment
# variable with a local-development default. No secret is ever committed here.
# =============================================================================
spring:
  application:
    name: codearena-backend

  lifecycle:
    # How long graceful shutdown waits for in-flight requests before giving up.
    #
    # Deliberately far below the 30s default, because of SSE. An event stream is a request
    # that is designed not to finish, and a stream whose browser has already gone away stays
    # counted as in-flight by Tomcat even after the server completes its emitter — so the
    # wait runs to the full timeout on any restart where somebody was watching a submission.
    #
    # Five seconds is generous for what actually needs draining here: no non-streaming
    # endpoint in this service does anything slower than a few indexed queries. The cost of
    # the shorter window is that a genuinely slow request could be cut off at five seconds
    # instead of thirty; the benefit is that restarts are predictable rather than stalling
    # for half a minute whenever the judge is in use. See ADR-027.
    timeout-per-shutdown-phase: 5s

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/codearena}
    username: ${DATABASE_USERNAME:codearena}
    password: ${DATABASE_PASSWORD:codearena}
    hikari:
      pool-name: codearena-api-pool
      # The binding constraint under concurrent submissions, measured rather than
      # assumed: a load test at fifteen concurrent submitters saturated this pool, and
      # hikaricp_connections_timeout_total rose in step with the tail latency. Size it
      # against expected concurrent writers, and remember PostgreSQL's own max
      # connections has to cover every API replica plus every worker.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Five seconds, not ten, and the reason is a collision rather than impatience.
      #
      # The browser's HTTP client gives up at ten seconds. With a ten-second pool
      # timeout, a saturated pool produced requests that succeeded at 10.2s -- just
      # after the client had abandoned them. The submission existed, the user was shown
      # a failure, and the natural response was to submit again. A duplicate submission
      # caused by a timeout race is a worse outcome than a clear refusal.
      #
      # Failing first means the client always receives an answer it can act on. A pool
      # that cannot produce a connection within five seconds is not about to produce one.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}

  jpa:
    open-in-view: false          # avoid lazy loading in the view layer / long-lived sessions
    hibernate:
      ddl-auto: validate         # the schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s

  # Sessions are the authentication credential, held in Redis rather than in servlet
  # memory so the API server can be restarted or scaled without signing everyone out.
  session:
    store-type: redis
    timeout: ${SESSION_TIMEOUT:PT2H}
    redis:
      namespace: codearena:session
      # Write session changes immediately rather than at request end. Two API instances
      # behind a load balancer must never serve a request from a stale session.
      flush-mode: immediate
      save-mode: on_set_attribute

server:
  port: ${BACKEND_PORT:8080}
  error:
    include-stacktrace: never    # stack traces are logged, never returned
    include-message: never
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: CODEARENA_SESSION
        # The browser must never expose the session id to JavaScript: an XSS bug should
        # not become a full account takeover.
        http-only: true
        # Off for plain-HTTP local development; must be true wherever HTTPS terminates.
        secure: ${SESSION_COOKIE_SECURE:false}
        # Lax still sends the cookie on same-site XHR (the SPA and API share a site in
        # both dev and deployment) while withholding it from cross-site POSTs.
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        # Health, info and Prometheus. Everything else -- env, configprops, heapdump,
        # loggers, mappings, beans, threaddump -- stays unexposed. The security rules
        # restrict /actuator/** to ADMIN, but an endpoint that can print the database
        # password should not be reachable at all: an authorisation rule is one
        # mistake away from being wrong, and an endpoint that does not exist is not.
        #
        # `prometheus` carries counts, durations and levels, never identifiers -- every
        # metric label in this system is a closed set (see BusinessMetrics). It is
        # still behind the ADMIN rule, because a scrape reveals traffic shape and
        # dependency versions and there is no reason for that to be public.
        # The curated admin view is /api/admin/system/status instead.
        include: health,info,prometheus
  endpoint:
    health:
      # Details for administrators only.
      #
      # `always` was disclosing the Redis version, the database engine, the container's
      # filesystem path and the host's free disk space to ANY caller -- /actuator/health is
      # unauthenticated by necessity, because container health checks and orchestrators
      # have no credentials. A precise dependency version is a gift to somebody matching
      # CVEs against a target.
      #
      # `when-authorized` keeps the bare status public, which is all a health check reads
      # (the compose probes use wget --spider and look only at the status code), while the
      # component breakdown needs an administrator session.
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
      # The three kinds of health, kept apart on purpose. docs/operations.md has the
      # full reasoning; the short version is that they answer different questions and
      # doing the wrong thing about each is expensive.
      #
      #   liveness  -- is this process alive? Nothing about a dependency belongs here.
      #                Restarting a healthy API server does not repair a database, and
      #                a liveness probe that fails when PostgreSQL is slow turns one
      #                outage into a restart loop that guarantees a second.
      #
      #   readiness -- can it serve traffic? It cannot without its database or its
      #                session store, so both are included. Failing readiness takes an
      #                instance out of rotation, which is correct AND reversible.
      #
      #   DEGRADED  -- serving fine, and something is still wrong: judging has stopped,
      #                or the queue is not draining. Deliberately NOT a probe, because
      #                removing the API from rotation would turn a judging outage into
      #                a total one. It is reported by /api/admin/system/status.
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      # Attached to every metric, so one dashboard can separate the services without
      # anything having to tag its own meters. Both are bounded values.
      application: ${spring.application.name}
      version: ${codearena.version:development}
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

codearena:
  version: @project.version@
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    # Cost factor for BCrypt. Raising it strengthens stored hashes and slows every login;
    # 12 is roughly a quarter-second per verification on modern hardware.
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    # Marks the session and CSRF cookies Secure. Must be true behind HTTPS.
    require-secure-cookies: ${SESSION_COOKIE_SECURE:false}

  submission:
    # Largest accepted program, in UTF-8 bytes. Generous for a solution, small enough that
    # it cannot be used to push megabytes into the database one POST at a time.
    max-source-bytes: ${MAX_SOURCE_BYTES:65536}

  # ---------------------------------------------------------------------------
  # Abuse protection. Every number here is a policy decision, not an implementation
  # detail, which is why none of them live in Java. The reasoning behind each one is in
  # docs/rate-limiting.md; the short version is in the comments below.
  #
  # `capacity` is the burst -- a bucket starts full, so an idle caller may spend all of
  # it at once. `refill-interval` is how long one request takes to come back, which is
  # the sustained rate. State lives in Redis, so these are the limits for the system as a
  # whole however many API instances are running.
  # ---------------------------------------------------------------------------
  rate-limit:
    # Off only for local experiments and for tests that are about something else. On by
    # default, so forgetting to set it is not a way to ship with no protection.
    enabled: ${RATE_LIMIT_ENABLED:true}

    # Whether X-Forwarded-For may be believed. FALSE unless a reverse proxy in front of
    # this API overwrites the header -- any client can send it, so trusting it without
    # that guarantee lets an attacker choose a fresh bucket per request. The shipped
    # compose deployment has no proxy in front of the API (nginx serves the frontend
    # only), so it stays off there.
    trust-forwarded-headers: ${RATE_LIMIT_TRUST_FORWARDED:false}

    # How long one identity's rejections collapse into a single audit event and a single
    # log line. Bounds what a rejected caller can write into an append-only table.
    violation-audit-cooldown: ${RATE_LIMIT_AUDIT_COOLDOWN:PT10M}

    # Login, per calling client: a flood cap, not the anti-guessing control. Generous
    # because this key can be shared by many honest users behind one address, and a tight
    # limit on a shared identity is a denial of service against all of them.
    login-origin:
      capacity: ${RATE_LIMIT_LOGIN_ORIGIN_BURST:30}
      refill-interval: ${RATE_LIMIT_LOGIN_ORIGIN_INTERVAL:PT2S}      # 30/minute sustained

    # Login, per account being attempted, counting only failures. This is the control that
    # actually stops password guessing, because it holds no matter how many sources the
    # attempts come from. Ten wrong answers up front, then one every thirty seconds; a
    # correct password clears it outright, so a legitimate user never accumulates.
    login-account:
      capacity: ${RATE_LIMIT_LOGIN_ACCOUNT_BURST:10}
      refill-interval: ${RATE_LIMIT_LOGIN_ACCOUNT_INTERVAL:PT30S}    # 2/minute sustained

    # Account creation, per client. Ten to begin with, then one every two minutes. Loose
    # enough that a developer seeding accounts or a classroom signing up together is not
    # obstructed, tight enough that scripted registration is not free.
    registration:
      capacity: ${RATE_LIMIT_REGISTRATION_BURST:10}
      refill-interval: ${RATE_LIMIT_REGISTRATION_INTERVAL:PT2M}      # 30/hour sustained

    # Submissions, per user, shared by practice and contests. Sized for a competitor
    # working quickly -- ten queued at once, then one every ten seconds -- because a human
    # who has just found a bug submits again within a minute, not within a second.
    submission:
      capacity: ${RATE_LIMIT_SUBMISSION_BURST:10}
      refill-interval: ${RATE_LIMIT_SUBMISSION_INTERVAL:PT10S}       # 6/minute sustained

    # Standings, per user. The page refreshes every 15 seconds; this allows 30 a minute,
    # so a browser -- even with several contests open -- is nowhere near it.
    standings:
      capacity: ${RATE_LIMIT_STANDINGS_BURST:60}
      refill-interval: ${RATE_LIMIT_STANDINGS_INTERVAL:PT2S}         # 30/minute sustained

    # Catalogue search, per user. Only applies when a search term is present.
    problem-search:
      capacity: ${RATE_LIMIT_PROBLEM_SEARCH_BURST:60}
      refill-interval: ${RATE_LIMIT_PROBLEM_SEARCH_INTERVAL:PT2S}    # 30/minute sustained

    # Administrative reads, per administrator. The system dashboard polls every 10
    # seconds and the audit page pages on demand; 60 a minute leaves both far clear.
    admin-read:
      capacity: ${RATE_LIMIT_ADMIN_READ_BURST:120}
      refill-interval: ${RATE_LIMIT_ADMIN_READ_INTERVAL:PT1S}        # 60/minute sustained

    # Deliberately far tighter than admin-read, and fails closed rather than open. These
    # are the operations that compute ratings for a whole field and write history that
    # cannot be undone; a human does them a few times, so anything approaching this rate
    # is a script.
    admin-write:
      capacity: ${RATE_LIMIT_ADMIN_WRITE_BURST:20}
      refill-interval: ${RATE_LIMIT_ADMIN_WRITE_INTERVAL:PT3S}       # 20/minute sustained

  queue:
    # How often the recovery sweeper looks for lost or stranded submissions.
    sweep-interval-ms: ${QUEUE_SWEEP_INTERVAL_MS:30000}
    # A QUEUED submission published longer ago than this is presumed lost and republished.
    # Generous, because republishing early only creates duplicate deliveries - harmless,
    # but pointless work.
    publish-stale-after: ${QUEUE_PUBLISH_STALE_AFTER:PT2M}
    # How long a worker may hold a claim before it is presumed dead. Must comfortably
    # exceed the slowest legitimate judgement: compile timeout plus every test running to
    # its limit.
    claim-lease: ${QUEUE_CLAIM_LEASE:PT5M}
    # How many times a submission may be claimed before the judge gives up on it with
    # SYSTEM_ERROR. Bounded so a submission that reliably kills its worker cannot cycle
    # through the pool forever.
    max-attempts: ${QUEUE_MAX_ATTEMPTS:3}

# =============================================================================
# Logging
#
# Levels, and what each one means here:
#   ERROR  a failed operation that needs investigating. Someone should look.
#   WARN   a recoverable abnormality -- a retry, a degraded path, a rejected caller.
#   INFO   meaningful lifecycle events: a login, a submission, a verdict, a startup.
#   DEBUG  development diagnostics only. NEVER enabled by default, and never in a
#          production deployment: Spring at DEBUG prints request bodies, and this
#          application's request bodies contain passwords and source code.
#
# Never logged anywhere, at any level: passwords and hashes, session identifiers,
# CSRF tokens, the executor token, submitted source code, hidden test inputs and
# expected outputs, database and Redis credentials. Messages carry ids, never content.
# =============================================================================
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.codearena: ${LOG_LEVEL_APP:INFO}
    org.springframework: INFO
  pattern:
    # `req=` is the correlation id from RequestIdFilter, and it must be in the pattern
    # for Phase 8's request correlation to mean anything: the filter has always put it
    # in the MDC, but until now no pattern printed it, so the id existed in audit rows
    # and in nothing an operator could grep. It is here now, and the log line for a
    # failing request can be found from the audit event that recorded it.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] req=%X{requestId:-none} %logger{36} - %msg%n"
  structured:
    format:
      # Empty by default: a human reading `docker compose logs` wants the pattern
      # above. Set LOG_STRUCTURED_FORMAT=ecs (or logstash, or gelf) in a deployment
      # that ships logs somewhere, and every line becomes JSON with the MDC fields as
      # first-class keys -- no extra dependency, and no second logging configuration
      # to keep in step with this one.
      console: ${LOG_STRUCTURED_FORMAT:}

---
# Profile used when the service runs inside docker compose.
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/codearena}
  data:
    redis:
      host: ${REDIS_HOST:redis}
