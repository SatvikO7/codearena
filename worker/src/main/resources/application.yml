# =============================================================================
# CodeArena judge worker
#
# The worker owns no schema: PostgreSQL migrations are applied exclusively by the
# API server, so that several worker replicas can never race to migrate.
# =============================================================================
spring:
  application:
    name: codearena-worker

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/codearena}
    username: ${DATABASE_USERNAME:codearena}
    password: ${DATABASE_PASSWORD:codearena}
    hikari:
      pool-name: codearena-worker-pool
      # A worker only needs a connection while recording progress and results, so its
      # pool is sized from judging concurrency rather than from request concurrency.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      # A worker may wait longer than the API does: nobody is holding a browser open on
      # the other end, and abandoning a judgement costs a container's worth of work.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}


  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s

  lifecycle:
    # Give an in-flight submission time to finish and its container time to be removed
    # before the JVM exits.
    timeout-per-shutdown-phase: 30s

server:
  port: ${WORKER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Health and Prometheus. The worker publishes no ports and lives on internal
        # compose networks, so this surface is reachable only from inside the
        # deployment -- which is the boundary being relied on, and it is worth naming
        # rather than assuming.
        include: health,prometheus
  endpoint:
    health:
      # `always` was returning the database engine, the Redis version and the
      # container's disk figures to anything that could reach this port. Nothing here
      # authenticates, and there is no admin UI on this service for the detail to
      # serve, so there is nobody to show it to. The probes read only the status.
      show-details: never
      probes:
        enabled: true
      group:
        # A worker with no database or Redis cannot judge anything, so it should be
        # taken out of rotation rather than left to turn every submission into a
        # system error. Liveness stays bare: restarting will not fix either of them.
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: ${spring.application.name}
      version: ${codearena.version:development}

codearena:
  # Filtered in at build time. Reported in the heartbeat and tagged onto every metric,
  # so a rollout that has only reached some of the replicas is visible rather than
  # something to be deduced from container ages.
  version: @project.version@

  worker:
    # Defaults to the container hostname, which docker compose makes unique per replica.
    id: ${WORKER_ID:${HOSTNAME:worker-local}}
    # How many submissions this process judges at once. Each one holds a container, so
    # this is the number of sandboxes this worker contributes to the host.
    concurrency: ${WORKER_CONCURRENCY:2}

  executor:
    # The execution service. As of Phase 6 the worker does NOT hold the Docker socket and
    # has no Docker client installed; it asks this service to run things, over a contract
    # that cannot express a mount, an image or a capability. See ADR-028.
    url: ${EXECUTOR_URL:http://executor:8082}
    # No default. The worker will not start without it, because a worker that cannot
    # authenticate to the executor cannot judge anything and should say so at boot rather
    # than turn every submission into a system error.
    token: ${EXECUTOR_TOKEN:}
    connect-timeout: ${EXECUTOR_CONNECT_TIMEOUT:PT5S}
    # Must outlast the slowest execution the executor permits, or a legitimately slow
    # compile would be reported as an infrastructure failure.
    read-timeout: ${EXECUTOR_READ_TIMEOUT:PT2M}

  execution:
    # Compilation gets its own budget: a problem's 1s run limit says nothing about how long
    # g++ may take, and a compiler is itself a resource-exhaustion surface.
    compile-timeout-ms: ${COMPILE_TIMEOUT_MS:20000}
    compile-memory-mb: ${COMPILE_MEMORY_MB:512}
    # Fractional CPU quota per sandbox, so one busy loop cannot starve the host.
    cpus: ${EXECUTION_CPUS:1.0}
    # Maximum processes in a sandbox. This, not the timeout, is what stops a fork bomb.
    pids-limit: ${EXECUTION_PIDS_LIMIT:64}
    # Maximum stdout+stderr captured before the run is abandoned.
    output-limit-bytes: ${EXECUTION_OUTPUT_LIMIT_BYTES:65536}
    # Writable scratch inside each sandbox; the rest of its filesystem is read-only.
    workspace-tmpfs-mb: ${EXECUTION_TMPFS_MB:64}

# See the backend's application.yml for the level policy and the list of things that
# are never logged. The submission id is the correlation key on this side: it is what
# ties a queue job to a judgement to a verdict, and it is in the MDC for every line a
# judgement produces, including ones from libraries that know nothing about it.
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.codearena: ${LOG_LEVEL_APP:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] sub=%X{submissionId:-none} %logger{36} - %msg%n"
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/codearena}
  data:
    redis:
      host: ${REDIS_HOST:redis}
