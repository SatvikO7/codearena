# =============================================================================
# CodeArena - full local development stack.
#
#   cp .env.example .env   &&   docker compose up --build
#
# Networks are split deliberately:
#   * `edge`     - only the frontend and the backend sit here; it is what the host
#                  reaches through published ports.
#   * `internal` - PostgreSQL and Redis. Marked `internal: true`, so nothing attached
#                  to it can reach the internet and nothing outside can reach it.
# The worker joins `internal` only: it needs the database and the queue, and has no
# reason to be reachable from the host except for its health endpoint.
# =============================================================================

name: codearena

# =============================================================================
# Resource ceilings
#
# Every service carries one, and the reason is specific rather than tidy-mindedness:
# each JVM here runs with -XX:MaxRAMPercentage=75, which is a percentage OF THE
# CONTAINER'S LIMIT. With no limit declared, the JVM reads the host's memory instead,
# so three services each sized their heap at 75% of the whole machine and the first
# real load decided which of them the kernel killed.
#
# These are ceilings, not reservations: a service that stays well under its limit costs
# nothing. Raise them with environment variables rather than by editing this file.
#
# What these numbers do NOT bound is the sandboxes. Those are sibling containers created
# by the executor through the host daemon, so they are charged to the host and not to
# the executor's limit. Their aggregate is bounded elsewhere, by arithmetic rather than
# by a single setting -- see docs/operations.md, 'Resource boundaries'.
# =============================================================================
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # The authoritative store. Give it the most headroom of anything here.
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    cpus: ${POSTGRES_CPUS:-2}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codearena}
      POSTGRES_USER: ${POSTGRES_USER:-codearena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Deterministic collation so ORDER BY behaves identically on every machine.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codearena} -d ${POSTGRES_DB:-codearena}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sessions, the queue and rate-limit buckets. No eviction policy is set: evicting would silently drop sessions and queued jobs, and being restarted from the append-only file loses neither.
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    cpus: ${REDIS_CPUS:-1}
    # `appendonly yes` keeps queued submissions durable across a Redis restart.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # Docker's default is 10s, and Spring waits 5s for in-flight requests. Comfortable.
    stop_grace_period: 20s
    # Serves every request. MaxRAMPercentage=75 means a ~750m heap.
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    cpus: ${BACKEND_CPUS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codearena}
      DATABASE_USERNAME: ${POSTGRES_USER:-codearena}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      # Sessions are kept in Redis, so there is no signing secret to configure.
      # Cookies are marked Secure only where HTTPS terminates; local compose is plain
      # HTTP, and a Secure cookie would simply never be sent.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-PT2H}
      # Abuse controls. Every default here matches application.yml, so leaving them
      # unset changes nothing; they are listed so a deployment can be tuned without
      # rebuilding an image. The reasoning behind each number, and what each one is
      # protecting, is in docs/rate-limiting.md.
      #
      # TRUST_FORWARDED stays false here: nginx in this stack serves the built frontend
      # and does not proxy the API, so there is no proxy overwriting X-Forwarded-For and
      # trusting it would let a client choose its own rate-limit bucket.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_TRUST_FORWARDED: ${RATE_LIMIT_TRUST_FORWARDED:-false}
      RATE_LIMIT_AUDIT_COOLDOWN: ${RATE_LIMIT_AUDIT_COOLDOWN:-PT10M}
      RATE_LIMIT_LOGIN_ORIGIN_BURST: ${RATE_LIMIT_LOGIN_ORIGIN_BURST:-30}
      RATE_LIMIT_LOGIN_ORIGIN_INTERVAL: ${RATE_LIMIT_LOGIN_ORIGIN_INTERVAL:-PT2S}
      RATE_LIMIT_LOGIN_ACCOUNT_BURST: ${RATE_LIMIT_LOGIN_ACCOUNT_BURST:-10}
      RATE_LIMIT_LOGIN_ACCOUNT_INTERVAL: ${RATE_LIMIT_LOGIN_ACCOUNT_INTERVAL:-PT30S}
      RATE_LIMIT_REGISTRATION_BURST: ${RATE_LIMIT_REGISTRATION_BURST:-10}
      RATE_LIMIT_REGISTRATION_INTERVAL: ${RATE_LIMIT_REGISTRATION_INTERVAL:-PT2M}
      RATE_LIMIT_SUBMISSION_BURST: ${RATE_LIMIT_SUBMISSION_BURST:-10}
      RATE_LIMIT_SUBMISSION_INTERVAL: ${RATE_LIMIT_SUBMISSION_INTERVAL:-PT10S}
      RATE_LIMIT_STANDINGS_BURST: ${RATE_LIMIT_STANDINGS_BURST:-60}
      RATE_LIMIT_STANDINGS_INTERVAL: ${RATE_LIMIT_STANDINGS_INTERVAL:-PT2S}
      RATE_LIMIT_PROBLEM_SEARCH_BURST: ${RATE_LIMIT_PROBLEM_SEARCH_BURST:-60}
      RATE_LIMIT_PROBLEM_SEARCH_INTERVAL: ${RATE_LIMIT_PROBLEM_SEARCH_INTERVAL:-PT2S}
      RATE_LIMIT_ADMIN_READ_BURST: ${RATE_LIMIT_ADMIN_READ_BURST:-120}
      RATE_LIMIT_ADMIN_READ_INTERVAL: ${RATE_LIMIT_ADMIN_READ_INTERVAL:-PT1S}
      RATE_LIMIT_ADMIN_WRITE_BURST: ${RATE_LIMIT_ADMIN_WRITE_BURST:-20}
      RATE_LIMIT_ADMIN_WRITE_INTERVAL: ${RATE_LIMIT_ADMIN_WRITE_INTERVAL:-PT3S}

      RATING_AUTO_FINALIZE: ${RATING_AUTO_FINALIZE:-true}
      RATING_SWEEP_INTERVAL_MS: ${RATING_SWEEP_INTERVAL_MS:-60000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - edge
      - internal

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    # MUST exceed the worker's own 30s drain. On the default 10s, SIGKILL arrived while the worker was still finishing a judgement -- so it never deregistered, and every deploy left a worker that looked stale for five minutes. A status page that reports a fault after every routine release is one people learn to ignore.
    stop_grace_period: 45s
    # Judges, but never runs submitted code in this process -- that happens in sandbox containers charged to the host, not to this limit.
    mem_limit: ${WORKER_MEM_LIMIT:-1g}
    cpus: ${WORKER_CPUS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The backend owns the Flyway migrations, so the worker waits for the schema.
      backend:
        condition: service_healthy
      # Nothing can be judged until the execution service is answering.
      executor:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codearena}
      DATABASE_USERNAME: ${POSTGRES_USER:-codearena}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      EXECUTOR_URL: http://executor:8082
      # Shared secret for the execution service. Both sides read the same variable and
      # both refuse to start without it.
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:?EXECUTOR_TOKEN must be set in .env}
    # No volumes. In particular, no Docker socket: as of Phase 6 the worker cannot
    # reach a container runtime at all, and the image has no Docker client in it. It
    # asks the `executor` service to run things, over a contract that cannot express a
    # mount, an image, a capability or a network. See ADR-028 and docs/threat-model.md.
    # No published ports: the worker serves no public traffic. The health check below
    # runs inside the container itself, so the endpoint never has to be exposed.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - internal
      - sandbox

  # ---------------------------------------------------------------------------
  # The execution service.
  #
  # This is the ONLY container that receives the Docker socket, and it is the reason
  # the worker no longer does. Read docs/threat-model.md before changing anything here.
  #
  # WHY IT HAS THE SOCKET
  #   Running untrusted code in disposable containers requires talking to a container
  #   runtime. Something must hold that authority. The question is only which process,
  #   and how much else that process does.
  #
  # WHY THAT IS BETTER THAN THE WORKER HOLDING IT
  #   This service has no database, no queue, no user model and four endpoints, none of
  #   which can name an image, a mount, a capability or a network. The worker — which
  #   parses untrusted program output and talks to PostgreSQL and Redis — now holds only
  #   a token for that contract. A compromise of the worker no longer implies host
  #   control; it implies "can ask for a sandboxed program to be run".
  #
  # WHAT IS STILL TRUE
  #   Whatever holds the socket is host-equivalent if IT is compromised. That is now
  #   this container. The attack surface has been made much smaller, not zero, and the
  #   real fixes — a rootless daemon, or a runtime with its own kernel boundary such as
  #   gVisor or Kata — remain future work. This is stated in docs/security.md rather
  #   than quietly left for someone to discover.
  #
  # Deliberately NOT granted to the backend, the worker or the frontend.
  # ---------------------------------------------------------------------------
  executor:
    build:
      context: .
      dockerfile: executor/Dockerfile
    restart: unless-stopped
    # Same arithmetic: its drain window is 30s, so 10s would cut every shutdown short and orphan sandbox containers for the reaper to find.
    stop_grace_period: 45s
    # Starts containers and streams their output; it runs nothing itself.
    mem_limit: ${EXECUTOR_MEM_LIMIT:-512m}
    cpus: ${EXECUTOR_CPUS:-1}
    environment:
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:?EXECUTOR_TOKEN must be set in .env}
      SANDBOX_MAX_OPEN_WORKSPACES: ${SANDBOX_MAX_OPEN_WORKSPACES:-16}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # The socket's owning group is a property of the host, not of the image: gid 0 on
    # Docker Desktop's VM, usually the `docker` group on a Linux host. Set
    # DOCKER_SOCKET_GID in .env if the executor reports a permission error.
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    # No published ports: only the worker talks to it, over the `sandbox` network.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # `sandbox` ONLY. The executor has no reason to reach PostgreSQL or Redis, and
    # nothing it holds should be usable to go looking for them.
    networks:
      - sandbox

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    # nginx serving static files.
    mem_limit: ${FRONTEND_MEM_LIMIT:-128m}
    cpus: ${FRONTEND_CPUS:-0.5}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 8080 inside the container: nginx runs unprivileged there and cannot bind 80.
      # The published port is unchanged.
      - "${FRONTEND_PORT:-5173}:8080"
    healthcheck:
      # 127.0.0.1, not `localhost`: in the container `localhost` resolves to ::1 first
      # and nginx binds IPv4 only, so a localhost probe reports a false failure.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - edge

volumes:
  postgres-data:
  redis-data:

networks:
  edge:
  # Carries exactly one conversation: worker -> executor. Internal, so a compromise of
  # either cannot reach the internet from it.
  sandbox:
    internal: true
  internal:
    # Cuts this network off from the host's external network: containers attached to
    # it get no default route, so a compromised component cannot phone home.
    #
    # A consequence worth knowing: Docker cannot publish a host port for a container
    # that is only on an internal network, so PostgreSQL and Redis are deliberately
    # NOT reachable from the host. Inspect them from inside the network instead:
    #   docker compose exec postgres psql -U codearena -d codearena
    #   docker compose exec redis redis-cli
    internal: true
