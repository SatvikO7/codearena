# =============================================================================
# CodeArena - full local development stack.
#
#   cp .env.example .env   &&   docker compose up --build
#
# Networks are split deliberately:
#   * `edge`     - only the frontend and the backend sit here; it is what the host
#                  reaches through published ports.
#   * `internal` - PostgreSQL and Redis. Marked `internal: true`, so nothing attached
#                  to it can reach the internet and nothing outside can reach it.
# The worker joins `internal` only: it needs the database and the queue, and has no
# reason to be reachable from the host except for its health endpoint.
# =============================================================================

name: codearena

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codearena}
      POSTGRES_USER: ${POSTGRES_USER:-codearena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Deterministic collation so ORDER BY behaves identically on every machine.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codearena} -d ${POSTGRES_DB:-codearena}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # `appendonly yes` keeps queued submissions durable across a Redis restart.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codearena}
      DATABASE_USERNAME: ${POSTGRES_USER:-codearena}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      # Sessions are kept in Redis, so there is no signing secret to configure.
      # Cookies are marked Secure only where HTTPS terminates; local compose is plain
      # HTTP, and a Secure cookie would simply never be sent.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-PT2H}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - edge
      - internal

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The backend owns the Flyway migrations, so the worker waits for the schema.
      backend:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codearena}
      DATABASE_USERNAME: ${POSTGRES_USER:-codearena}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    # No published ports: the worker serves no public traffic. The health check below
    # runs inside the container itself, so the endpoint never has to be exposed.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      # 127.0.0.1, not `localhost`: in the container `localhost` resolves to ::1 first
      # and nginx binds IPv4 only, so a localhost probe reports a false failure.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - edge

volumes:
  postgres-data:
  redis-data:

networks:
  edge:
  internal:
    # Cuts this network off from the host's external network: containers attached to
    # it get no default route, so a compromised component cannot phone home.
    #
    # A consequence worth knowing: Docker cannot publish a host port for a container
    # that is only on an internal network, so PostgreSQL and Redis are deliberately
    # NOT reachable from the host. Inspect them from inside the network instead:
    #   docker compose exec postgres psql -U codearena -d codearena
    #   docker compose exec redis redis-cli
    internal: true
